name: Build and Test (windows, android)

#Ensures no duplicate workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths:
      - 'Application/**'
      - 'Engine/**'
      - 'Tester/**' #Only run if stuff within these folders change.
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Application/**'
      - 'Engine/**'
      - 'Tester/**' #Only run if stuff within these folders change.
      
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  windows-build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4 #Check out this repo.
      # Set up java for android gradlew to work.
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      #Save github minutes compared to parallel jobs. Using android x86_64 build because it's faster to build.
      - name: Windows Build-Test
        shell: cmd
        run: |
          call ./Tester.bat
          if errorlevel 1 (
            echo Windows build-test failed
            exit /b 1
          )
