plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.jnicpp'
    compileSdk 36

    flavorDimensions "abi"

    productFlavors {
        arm64 {
            dimension "abi"
            ndk {
                abiFilters "arm64-v8a"
            }
            // Pass ABI to CMake as a define
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_ABI=arm64-v8a"
                }
            }
            buildConfigField "String", "TARGET_ABI", "\"arm64-v8a\""
        }
        x86_64 {
            dimension "abi"
            ndk {
                abiFilters "x86_64"
            }
            // Pass ABI to CMake as a define
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_ABI=x86_64"
                }
            }
            buildConfigField "String", "TARGET_ABI", "\"x86_64\""
        }
    }
    defaultConfig {
        applicationId "com.example.jnicpp"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "IS_DEBUG_BUILD", "false"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-fms-extensions"
            }
        }
    }

    buildTypes {
        release {
            // Enable R8 code shrinking, obfuscation, and optimization
            minifyEnabled true
            shrinkResources true

            // Explicitly strip debug configurations
            debuggable false
            jniDebuggable false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "IS_DEBUG_BUILD", "false"
            signingConfig signingConfigs.debug

            // Fully optimize C/C++ natively and strip out debug symbols (-O3 for speed, -g0 for no debug info)
            externalNativeBuild {
                cmake {
                    cFlags "-O3 -g0"
                    cppFlags "-O3 -g0"
                }
            }
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "IS_DEBUG_BUILD", "true"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation files('libs/fmod.jar')
}